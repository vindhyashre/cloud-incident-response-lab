name: Docker Build CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloud-incident-response-lab .

      - name: Verify Docker image
        run: docker images cloud-incident-response-lab